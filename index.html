<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily News Summary</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --card-bg: #f0f2f5;
    --text: #1a1a1a;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --border: #e5e7eb;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --cat-top: #E24B4A;
    --cat-domestic: #378ADD;
    --cat-intl: #1D9E75;
    --cat-economy: #BA7517;
    --cat-tech: #7F77DD;
    --cat-sports: #D4537E;
    --cat-other: #888780;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --card-bg: #242424;
      --text: #e8e8e8;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --accent: #60a5fa;
      --accent-light: #1e293b;
      --border: #2d2d2d;
      --shadow: 0 1px 2px rgba(0,0,0,0.2);
      --cat-top: #F09595;
      --cat-domestic: #85B7EB;
      --cat-intl: #5DCAA5;
      --cat-economy: #FAC775;
      --cat-tech: #AFA9EC;
      --cat-sports: #ED93B1;
      --cat-other: #B4B2A9;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-icon svg {
    width: 16px;
    height: 16px;
    fill: #fff;
  }
  .header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .header-meta {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  /* Date Navigation */
  .date-nav {
    max-width: 640px;
    margin: 0 auto;
    padding: 12px 20px 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .date-nav::-webkit-scrollbar { display: none; }

  .date-btn {
    flex-shrink: 0;
    padding: 7px 16px;
    border: none;
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .date-btn:hover {
    color: var(--accent);
    background: var(--accent-light);
  }
  .date-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* Category Filter */
  .cat-nav {
    max-width: 640px;
    margin: 0 auto;
    padding: 10px 20px 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cat-nav::-webkit-scrollbar { display: none; }

  .cat-btn {
    flex-shrink: 0;
    padding: 5px 12px;
    border: none;
    border-radius: 14px;
    background: transparent;
    color: var(--text-tertiary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .cat-btn:hover {
    color: var(--text);
  }
  .cat-btn.active {
    background: var(--card-bg);
    color: var(--text);
  }

  /* Main Content */
  .main {
    max-width: 640px;
    margin: 0 auto;
    padding: 12px 20px 80px;
  }

  /* Section */
  .section {
    margin-bottom: 20px;
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .section-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Article Card */
  .article {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
    transition: transform 0.1s ease;
  }
  .article:active {
    transform: scale(0.985);
  }
  .article-headline {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 5px;
    line-height: 1.55;
  }
  .article-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.65;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Day header */
  .day-header {
    margin: 16px 0 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .day-header .date-label {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .day-header .fetched {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  /* Loading / Error / Empty */
  .status-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 14px;
  }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-secondary);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .header { padding: 12px 16px; }
    .date-nav { padding: 10px 16px 0; }
    .cat-nav { padding: 8px 16px 0; }
    .main { padding: 10px 16px 60px; }
    .day-header .date-label { font-size: 18px; }
    .article { padding: 12px 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      </div>
      <h1>Daily News</h1>
    </div>
    <div class="header-meta" id="totalCount"></div>
  </div>
</div>

<div class="date-nav" id="dateNav"></div>
<div class="cat-nav" id="catNav"></div>

<div class="main" id="content">
  <div class="status-msg">読み込み中...</div>
</div>

<script>
(function() {
  var summaries = [];
  var activeDate = null;
  var activeCat = 'all';

  var catColors = {
    'トップ': 'var(--cat-top)',
    '国内': 'var(--cat-domestic)',
    '国際': 'var(--cat-intl)',
    '経済': 'var(--cat-economy)',
    'ビジネス': 'var(--cat-economy)',
    'テクノロジー': 'var(--cat-tech)',
    'テク': 'var(--cat-tech)',
    'スポーツ': 'var(--cat-sports)'
  };

  function getCatColor(title) {
    var keys = Object.keys(catColors);
    for (var i = 0; i < keys.length; i++) {
      if (title.indexOf(keys[i]) !== -1) return catColors[keys[i]];
    }
    return 'var(--cat-other)';
  }

  function getCatKey(title) {
    if (title.indexOf('トップ') !== -1) return 'top';
    if (title.indexOf('国内') !== -1) return 'domestic';
    if (title.indexOf('国際') !== -1) return 'intl';
    if (title.indexOf('経済') !== -1 || title.indexOf('ビジネス') !== -1) return 'economy';
    if (title.indexOf('テクノロジー') !== -1 || title.indexOf('テク') !== -1) return 'tech';
    if (title.indexOf('スポーツ') !== -1) return 'sports';
    return 'other';
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var days = ['日', '月', '火', '水', '木', '金', '土'];
    return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + days[d.getDay()] + '）';
  }

  function formatDateFull(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var days = ['日', '月', '火', '水', '木', '金', '土'];
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + days[d.getDay()] + '）';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderDateNav() {
    var nav = document.getElementById('dateNav');
    nav.innerHTML = '';
    summaries.forEach(function(s) {
      var btn = document.createElement('button');
      btn.className = 'date-btn' + (s.date === activeDate ? ' active' : '');
      btn.textContent = formatDate(s.date);
      btn.addEventListener('click', function() {
        activeDate = s.date;
        activeCat = 'all';
        renderDateNav();
        renderCatNav();
        renderContent();
      });
      nav.appendChild(btn);
    });
  }

  function renderCatNav() {
    var nav = document.getElementById('catNav');
    nav.innerHTML = '';
    var data = summaries.find(function(s) { return s.date === activeDate; });
    if (!data) return;

    var cats = [{ key: 'all', label: '全て' }];
    data.sections.forEach(function(sec) {
      cats.push({ key: getCatKey(sec.title), label: sec.title });
    });

    cats.forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'cat-btn' + (activeCat === cat.key ? ' active' : '');
      btn.textContent = cat.label;
      btn.addEventListener('click', function() {
        activeCat = cat.key;
        renderCatNav();
        renderContent();
      });
      nav.appendChild(btn);
    });
  }

  function renderContent() {
    var main = document.getElementById('content');
    var data = summaries.find(function(s) { return s.date === activeDate; });

    if (!data) {
      main.innerHTML = '<div class="empty">データがありません</div>';
      return;
    }

    var html = '';
    html += '<div class="day-header">';
    html += '<div class="date-label">' + formatDateFull(data.date) + '</div>';
    if (data.fetchedAt) {
      html += '<div class="fetched">' + escapeHtml(data.fetchedAt) + '</div>';
    }
    html += '</div>';

    var sectionsToShow = data.sections;
    if (activeCat !== 'all') {
      sectionsToShow = data.sections.filter(function(sec) {
        return getCatKey(sec.title) === activeCat;
      });
    }

    sectionsToShow.forEach(function(section) {
      var color = getCatColor(section.title);
      html += '<div class="section">';
      html += '<div class="section-label"><span class="section-dot" style="background:' + color + '"></span>' + escapeHtml(section.title) + '</div>';

      section.articles.forEach(function(article) {
        html += '<div class="article">';
        html += '<div class="article-headline">' + escapeHtml(article.headline) + '</div>';
        html += '<div class="article-summary">' + escapeHtml(article.summary) + '</div>';
        html += '</div>';
      });

      html += '</div>';
    });

    if (sectionsToShow.length === 0) {
      html += '<div class="empty">このカテゴリの記事はありません</div>';
    }

    main.innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function updateMeta() {
    var total = 0;
    summaries.forEach(function(s) {
      s.sections.forEach(function(sec) { total += sec.articles.length; });
    });
    document.getElementById('totalCount').textContent = summaries.length + '日分 / ' + total + '件';
  }

  fetch('data/summaries.json')
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load');
      return res.json();
    })
    .then(function(data) {
      summaries = data.sort(function(a, b) {
        return b.date.localeCompare(a.date);
      });
      if (summaries.length > 0) {
        activeDate = summaries[0].date;
      }
      renderDateNav();
      renderCatNav();
      renderContent();
      updateMeta();
    })
    .catch(function(err) {
      document.getElementById('content').innerHTML =
        '<div class="status-msg">データの読み込みに失敗しました。<br><small>' + escapeHtml(err.message) + '</small></div>';
    });
})();
</script>
</body>
</html>
