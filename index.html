(function(){var s=[],a=null;function gi(t){if(t.includes("\u30c8\u30c3\u30d7"))return"\ud83d\udd34";if(t.includes("\u56fd\u5185"))return"\ud83c\uddef\ud83c\uddf5";if(t.includes("\u56fd\u969b"))return"\ud83c\udf0d";if(t.includes("\u7d4c\u6e08")||t.includes("\u30d3\u30b8\u30cd\u30b9"))return"\ud83d\udcb9";if(t.includes("\u30c6\u30af\u30ce\u30ed\u30b8\u30fc"))return"\ud83d\udcbb";if(t.includes("\u30b9\u30dd\u30fc\u30c4"))return"\u26bd";return"\ud83d\udccc";}

function fdf(d){var x=new Date(d+"T00:00:00"),w=["\u65e5","\u6708","\u706b","\u6c34","\u6728","\u91d1","\u571f"];return x.getFullYear()+"\u5e74"+(x.getMonth()+1)+"\u6708"+x.getDate()+"\u65e5\uff08"+w[x.getDay()]+"\uff09";}
function rn(){var n=document.getElementById("dateNav");n.innerHTML="";s.forEach(function(e){var b=document.createElement("button");b.className="date-btn"+(e.date===a?" active":"");b.textContent=fd(e.date);b.addEventListener("click",function(){a=e.date;rn();rc();});n.appendChild(b);});}
function rc(){var m=document.getElementById("content"),d=s.find(function(e){return e.date===a;});if(!d){m.innerHTML='<div class="empty">\u30c7\u30fc\u30bf\u304c\u3042\u308a\u307e\u305b\u3093</div>';return;}var h='<div class="day-header"><div class="date-label">'+fdf(d.date)+"</div>"+(d.fetchedAt?'<div class="fetched">\u53d6\u5f97: '+eh(d.fetchedAt)+"</div>":"")+"</div>";d.sections.forEach(function(sec){h+='<div class="section"><div class="section-title">'+gi(sec.title)+" "+eh(sec.title)+"</div>";sec.articles.forEach(function(ar){h+='<div class="article"><div class="article-headline">'+eh(ar.headline)+'</div><div class="article-summary">'+eh(ar.summary)+"</div></div>";});h+="</div>";});m.innerHTML=h;window.scrollTo({top:0,behavior:"smooth"});}
function eh(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;}
function um(){var t=0;s.forEach(function(e){e.sections.forEach(function(sec){t+=sec.articles.length;});});document.getElementById("totalCount").textContent=s.length+"\u65e5\u5206 / "+t+"\u4ef6";}
fetch("data/summaries.json").then(function(r){if(!r.ok)throw new Error("Failed");return r.json();}).then(function(d){s=d.sort(function(x,y){return y.date.localeCompare(x.date);});if(s.length>0)a=s[0].date;rn();rc();um();}).catch(function(e){document.getElementById("content").innerHTML='<div class="status-msg">\u30c7\u30fc\u30bf\u306e\u8aad\u307f\u8fbc\u307f\u306b\u5931\u6557\u3057\u307e\u3057\u305f\u3002<br><small>'+eh(e.message)+"</small></div>";});})();
